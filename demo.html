<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Product Demo — Cliniva Clinic Booking & CRM</title>
  <meta name="description" content="Explore the full end-to-end capabilities of Cliniva across all user roles: Patient Self-Booking, Front-Desk Receptionist, Doctor & Practitioner, Branch Admin, Super Admin Owner, and WhatsApp Engine." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Modular Design System Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body style="background:var(--bg); min-height:100vh; display:flex; flex-direction:column;">

  <!-- DEMO HEADER -->
  <header class="demo-header">
    <div class="container">
      <!-- TOP ROW: LOGO + LANGUAGE + ACTIONS (ONE ROW) -->
      <div class="demo-topbar">
        <div style="display:flex; align-items:center; gap:16px;">
          <a href="index.html" class="logo">
            <span class="logo-mark">✦</span>
            Cliniva Demo Sandbox
          </a>
          <span class="badge-live" style="font-size:11px;">LIVE INTERACTIVE</span>
        </div>

        <div style="display:flex; align-items:center; gap:10px;">
          <div class="lang-switcher-wrap">
            <select class="lang-select" aria-label="Select Language">
              <option value="en">🇬🇧 English</option>
              <option value="ms">🇲🇾 Melayu</option>
              <option value="zh">🇨🇳 中文</option>
            </select>
          </div>
          <a href="index.html" class="btn btn-sm btn-soft" data-i18n="nav.backHome">← Back to Home</a>
          <a href="sign-in.html" class="btn btn-sm btn-primary" data-i18n="nav.signIn">Sign In Portal</a>
        </div>
      </div>

      <!-- BOTTOM ROW: ROLE SWITCHER ACROSS ALL ROLES -->
      <div class="demo-role-bar">
        <div class="demo-role-switcher" role="tablist">
          <button class="demo-role-btn active" data-pane="panePatientBooking" data-i18n="demo.role.patient" role="tab">
            🩺 Patient Booking
          </button>
          <button class="demo-role-btn" data-pane="paneReceptionist" data-i18n="demo.role.receptionist" role="tab">
            👩‍💼 Receptionist &amp; Front-Desk
          </button>
          <button class="demo-role-btn" data-pane="paneDoctor" data-i18n="demo.role.doctor" role="tab">
            👨‍⚕️ Doctor &amp; Practitioner
          </button>
          <button class="demo-role-btn" data-pane="paneBranchAdmin" data-i18n="demo.role.branchAdmin" role="tab">
            🏢 Branch Admin
          </button>
          <button class="demo-role-btn" data-pane="paneSuperAdmin" data-i18n="demo.role.superAdmin" role="tab">
            👑 Super Admin / Owner
          </button>
          <button class="demo-role-btn" data-pane="paneWhatsAppSimulator" data-i18n="demo.role.whatsapp" role="tab">
            💬 WhatsApp Engine
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN DEMO CONTENT (MODULAR ES MODULE COMPONENTS) -->
  <main id="demoContainer" class="container" style="flex:1; padding:32px 20px;"></main>

  <!-- MODAL CONTAINER FOR DYNAMIC MODAL COMPONENTS -->
  <div id="demoModalContainer"></div>

  <!-- FOOTER -->
  <footer>
    <div class="container footer-inner">
      <div>© 2026 Cliniva Healthcare Systems. Full Interactive Product Demo Sandbox.</div>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="sign-in.html">Sign In</a>
        <a href="ticket.html">Sample E-Ticket</a>
      </div>
    </div>
  </footer>

  <!-- Modular Demo Page Script Bootstrap -->
  <script type="module" src="js/pages/demo.js"></script>
</body>
</html>
