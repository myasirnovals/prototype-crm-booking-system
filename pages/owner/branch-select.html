<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pilih Cabang — Cliniva Clinic Gateway</title>
  <meta name="description" content="Gerbang pemilihan cabang klinik aktif bagi Owner sebelum masuk ke dashboard operasional." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Modular Design System Stylesheet -->
  <link rel="stylesheet" href="../../css/style.css?v=3">

  <style>
    .gateway-container {
      max-width: 980px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .gateway-header-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: var(--radius-xl);
      padding: 24px 32px;
      box-shadow: 0 4px 20px -5px rgba(0,0,0,0.04);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .gateway-header-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -8px rgba(15, 118, 110, 0.15);
    }

    .gateway-header-card.is-active {
      border-color: var(--primary);
      background: #fcfefe;
      box-shadow: 0 8px 24px -6px rgba(15, 118, 110, 0.15);
    }

    .gateway-brand-info {
      display: flex;
      align-items: center;
      gap: 18px;
      flex: 1;
      min-width: 280px;
    }

    .gateway-brand-logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #f0fdfa;
      border: 1.5px solid #99f6e4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .gateway-brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
    }

    .branch-brand-text {
      flex: 1;
    }

    .branch-brand-text h2 {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 4px;
      letter-spacing: -0.4px;
      color: var(--text);
    }

    .branch-brand-text p {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 8px;
      line-height: 1.4;
    }

    .branch-meta-row {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: #475569;
      flex-wrap: wrap;
    }

    .branch-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .branch-action-wrap {
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      .gateway-header-card {
        flex-direction: column;
        align-items: flex-start;
        padding: 20px;
      }
      .branch-action-wrap {
        width: 100%;
      }
      .branch-action-wrap button {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body style="background:#f1f5f9; min-height:100vh;">

  <!-- Minimal Header -->
  <header style="background:#ffffff; border-bottom:1px solid var(--line); padding:16px 28px;">
    <div style="max-width:1100px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size:22px; color:var(--primary);">✦</span>
        <span style="font-size:18px; font-weight:900; letter-spacing:-0.5px;">Cliniva Gateway</span>
        <span class="pill" style="font-size:11px; padding:3px 8px; background:#f0fdfa; color:var(--primary-dark); font-weight:800;">Branch Selector</span>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <!-- Language Switcher -->
        <div class="lang-switcher-wrap" style="position:relative;">
          <select class="lang-select" aria-label="Select Language" style="padding:6px 12px; font-size:12px; font-weight:700; border-radius:var(--radius-sm); border:1px solid var(--line); background:#fff; cursor:pointer;">
            <option value="en">🇬🇧 English</option>
            <option value="zh">🇸🇬 华语 (Singapura)</option>
            <option value="ms">🇲🇾 Bahasa Melayu (Malaysia)</option>
          </select>
        </div>

        <span id="gatewayLoggedInAs" style="font-size:12px; color:var(--muted); font-weight:600;">Signed in as <strong>Dennis Pratama</strong> (Owner)</span>
        <button type="button" class="btn btn-sm btn-white" id="gatewaySignOutBtn" data-i18n="nav.signOut">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="gateway-container">
    <!-- Section Heading & Global Action Bar -->
    <div style="margin-bottom:24px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px;">
      <div>
        <div class="pill" style="font-size:11px; padding:3px 10px; background:#e0f2fe; color:#0369a1; font-weight:800; margin-bottom:8px;" data-i18n="owner.gateway.badge">
          🏢 Owner Gateway · Operational Branch Selection
        </div>
        <h1 style="font-size:24px; font-weight:900; margin:0 0 4px; letter-spacing:-0.5px; color:var(--text);" data-i18n="owner.gateway.title">
          Select Active Operational Branch
        </h1>
        <p style="font-size:13px; color:var(--muted); margin:0;" data-i18n="owner.gateway.desc">
          Choose the clinic branch you wish to manage to access its branch-specific operations console.
        </p>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="pill" id="branchCountBadge" style="font-size:12px; padding:7px 14px; background:#e2e8f0; font-weight:700; color:#334155;">
          -- Registered Branches
        </span>
        <button type="button" class="btn btn-primary" id="btnOpenNewBranchModal" style="padding:10px 18px; font-weight:800; display:inline-flex; align-items:center; gap:6px; box-shadow:0 4px 14px rgba(15,118,110,0.25);">
          <span>➕</span> <span data-i18n="owner.gateway.btnNewBranch">Register New Branch</span>
        </button>
      </div>
    </div>

    <!-- Branch Cards List: Every branch styled uniformly using the gateway-header-card benchmark -->
    <div class="branch-list" id="branchCardsGrid" style="display:flex; flex-direction:column; gap:16px;">
      <!-- Dynamic branches rendered via branch-select.controller.js -->
    </div>
  </main>

  <!-- Modal Tambah Cabang Baru -->
  <div id="newBranchModalOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:999; align-items:center; justify-content:center; backdrop-filter:blur(3px);">
    <div style="background:#ffffff; border-radius:var(--radius-xl); max-width:560px; width:90%; padding:32px; box-shadow:0 20px 40px rgba(0,0,0,0.2); position:relative;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #e2e8f0; padding-bottom:14px;">
        <h3 style="margin:0; font-size:18px; font-weight:800;">🏢 Register New Branch</h3>
        <button type="button" id="btnCloseNewBranchModal" style="background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted);">&times;</button>
      </div>

      <form id="createBranchForm">
        <div class="field">
          <label for="newBranchName">Clinic Branch Name <span style="color:#ef4444;">*</span></label>
          <input type="text" id="newBranchName" placeholder="e.g. Marina Bay Wellness Center (Branch 2)" required>
        </div>

        <div class="field">
          <label for="newBranchTemplate">Branch Business Template</label>
          <select id="newBranchTemplate">
            <option value="physio" selected>🏃 Physiotherapy &amp; Sports Rehab</option>
            <option value="wellness">🌸 Wellness &amp; Spa Care</option>
            <option value="tcm">🌿 Traditional Chinese Medicine (TCM)</option>
            <option value="nutrition">🥗 Clinical Nutrition &amp; Dietetics</option>
          </select>
        </div>

        <div class="field">
          <label for="newBranchAddress">Full Branch Address <span style="color:#ef4444;">*</span></label>
          <input type="text" id="newBranchAddress" placeholder="Building, Street, Unit No., Postal Code" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="newBranchPhone">Branch WhatsApp / Phone</label>
            <input type="tel" id="newBranchPhone" placeholder="+65 6888 1234" required>
          </div>
          <div class="field">
            <label for="newBranchHours">Operating Hours</label>
            <input type="text" id="newBranchHours" placeholder="09:00 - 20:00 (Mon - Sat)" value="09:00 - 20:00 (Mon - Sat)">
          </div>
        </div>

        <div class="field">
          <label for="newBranchRooms">Treatment Rooms / Bays</label>
          <select id="newBranchRooms">
            <option value="2">2 Private Therapy Rooms</option>
            <option value="4" selected>4 Standard Therapy Rooms</option>
            <option value="6">6 Therapy Rooms &amp; Bays</option>
            <option value="8">8+ Multi-Specialty Treatment Rooms</option>
          </select>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:24px;">
          <button type="button" class="btn btn-soft" id="btnCancelNewBranch" data-i18n="branchAdmin.modalBtnCancel">Cancel</button>
          <button type="submit" class="btn btn-primary">🚀 Create Branch</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Page Script Bootstrap -->
  <script type="module" src="../../js/pages/branch-select.js"></script>
</body>
</html>
